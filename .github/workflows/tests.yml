name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Empty on purpose. Tests mock Supabase and must not read or write
          # the shop project even if this repository later gains secrets.
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          TOOL_ROOM_SMOKE: ""
        run: python -m pytest
